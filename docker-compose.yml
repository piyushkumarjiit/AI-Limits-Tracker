services:
  ai-limits-tracker:
    image: ghcr.io/piyushkumarjiit/ai-limits-tracker:latest
    build: .
    # HOST_PORT is the port on this host; the container always listens on 1455.
    # BIND_ADDR defaults to loopback — reach it through an SSH tunnel or a reverse
    # proxy. Set BIND_ADDR=0.0.0.0 to expose it on the LAN (see COOKIE_SECURE).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-1455}:1455"
    # The container runs as UID 1000; ./data must be writable by it:
    #   mkdir -p data && sudo chown 1000:1000 data
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Pinned so that a stray PORT in .env cannot make the app listen on a port
      # that is not the one published above.
      PORT: "1455"
      # Set TRUST_PROXY=1 only when a reverse proxy in front of the container sets X-Real-IP
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Inside unprivileged LXC containers Docker cannot load its AppArmor profile;
      # set APPARMOR_PROFILE=unconfined there.
      - apparmor=${APPARMOR_PROFILE:-docker-default}

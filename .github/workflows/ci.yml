name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Reused by docker-publish.yml so the image only publishes after these jobs pass.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (immutable); the trailing comment is the release tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Same flags as the Dockerfile.
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Typecheck (app, server, web, extension)
        run: npm run typecheck:all

      - name: Tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Fails on high or critical advisories in production dependencies.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>
    <linearGradient id="fqdText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="fqdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="8"/>
  <!-- FQD Monogram Text -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
        fill="url(#fqdText)" filter="url(#fqdGlow)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif"
        font-size="180" font-weight="900" letter-spacing="-4">FQD</text>
  <!-- Status Indicator Dot (Active Fleet) -->
  <circle cx="256" cy="405" r="14" fill="#10b981"/>
  <circle cx="256" cy="405" r="22" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
</svg>

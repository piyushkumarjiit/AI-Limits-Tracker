<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060910"/>
    </radialGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="256" y1="256" x2="385" y2="127" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cockpit Squircle Shell -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Radar Reticle Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="6"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#334155" stroke-width="5" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Reticle Crosshairs -->
  <line x1="256" y1="60" x2="256" y2="452" stroke="#1e293b" stroke-width="4" stroke-dasharray="6 6"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#1e293b" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- Sweep Sector (45 deg) -->
  <path d="M 256 256 L 256 76 A 180 180 0 0 1 383.3 128.7 Z" fill="url(#radarSweep)"/>
  <line x1="256" y1="256" x2="383" y2="129" stroke="url(#beamGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Telemetry Targets -->
  <circle cx="355" cy="155" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="355" cy="155" r="18" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="165" cy="325" r="8" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="175" cy="180" r="7" fill="#f59e0b"/>

  <!-- Cockpit Core Hub -->
  <circle cx="256" cy="256" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#f0f9ff"/>
</svg>
